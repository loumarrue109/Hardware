#adjust if needed e.g. when usb numeration changes
#this toml is called for dashboard

[serial]
port = "/dev/ttyUSB1"
baudrate = 9600
timeout = 2.0

[valve]
num_positions = 16   # number of ports on the valve
mode = 3             # 1 = 2 POS w/stops, 2 = 2 POS wo/stops, 3 = multipos
direction = "A"      # F = forward, R = reverse, A = auto (shortest path)
response_mode = 2    # 0 = none, 1 = limited, 2 = extended
high_speed = false
cycle_counter = 0
# offset intentionally not set: SO numbering starts at 1 and 0 is rejected

[mfc]
port = "/dev/ttyUSB2"   # verified: MFC answers here
address = 128
channel = 1
baudrate = 38400

[pressure_sensor]
port = "/dev/ttySC0"
address = 1
channel = 1
baud_rate = 9600
timeout = 0.5
echo = false

[pump]
pin = 17

[co2_sensor]
port = "/dev/ttyUSB0"   # verified: CO2 adapter is here (echoes via jumper)
baudrate = 19200
timeout = 2.0

[logging]
# Directory where the dashboard writes one timestamped CSV per logging
# session, e.g. co2_20261111_132916.csv
co2_path = "/home/intsampler/code/logging"
co2_window = 60            # summary window in seconds
# Quantities sent with the CO2 reading (see CALCS). CO2 is always included;
# CO2RAWUC gives uncompensated CO2, T/P/RH/O the compensation inputs.
co2_fields = ["CO2", "CO2RAWUC", "T", "P", "RH", "O"]
co2_average = 0         # disable the sensor's internal averaging filter;
                        # the logger does the per-minute averaging by hand
co2_mode = "average"    # "average" = per-minute mean/std, "raw" = one row
                        # per measurement (~2 s)
# The log always also includes mfc_flow_mean (MFC measured flow) and
# calib_ppm_mean (selected 0/3/400 ppm calibration gas, NaN if none).

# [analog]
# Analog output voltage reading (0-5 V, AMODE U) for calibration.
# adc = "none"   # "ads1115", "mcp3008", or a script that prints a float
