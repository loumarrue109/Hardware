#adjust if needed e.g. when usb numeration changes
#this toml is called for dashboard

[serial]
port = "/dev/ttyUSB1"
baudrate = 9600
timeout = 2.0

[valve]
num_positions = 16   # number of ports on the valve
mode = 3             # 1 = 2 POS w/stops, 2 = 2 POS wo/stops, 3 = multipos
direction = "A"      # F = forward, R = reverse, A = auto (shortest path)
response_mode = 2    # 0 = none, 1 = limited, 2 = extended
high_speed = false
cycle_counter = 0
# offset intentionally not set: SO numbering starts at 1 and 0 is rejected

[mfc]
port = "/dev/ttyUSB2"   # verified: MFC answers here
address = 128
channel = 1
baudrate = 38400

[pressure_sensor]
port = "/dev/ttySC0"
address = 1
channel = 1
baud_rate = 9600
timeout = 0.5
echo = false

[pump]
pin = 17

[co2_sensor]
port = "/dev/ttyUSB0"   # verified: CO2 adapter is here (echoes via jumper)
baudrate = 19200
timeout = 2.0
